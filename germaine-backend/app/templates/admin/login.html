<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — GTI Administration Portal</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}">
</head>
<body>
<div class="gti-login-wrap">
  <div class="gti-login-card">
    <h1>GTI Administration Portal</h1>
    <p class="sub">Sign in with your staff administrator account.</p>
    {% if error %}<div class="gti-login-error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('admin.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <button type="submit">Sign In</button>
    </form>
  </div>
</div>
</body>
</html>
