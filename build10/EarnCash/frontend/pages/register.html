<!DOCTYPE html>

<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<meta name="description" content="Create an EarnFastCash account to start earning referral commissions with Germaine Training Institute.">
<link rel="canonical" href="https://germaineinstitute.com/EarnCash/frontend/pages/register.html">



<title>

EarnCash | Create Account

</title>





<!-- CSS -->


<link rel="stylesheet" href="../css/variables.css">

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/background.css">

<link rel="stylesheet" href="../css/auth.css">





<!-- ICONS -->





</head>







<body>




<!-- BACKGROUND -->

<div class="background-blobs">


<span class="blob blob1"></span>

<span class="blob blob2"></span>

<span class="blob blob3"></span>


</div>





<div class="cursor-glow"></div>







<!-- ==========================
        REGISTER SECTION
=========================== -->


<section class="auth-section">





<div class="auth-container">





<!-- BRAND -->


<div class="auth-brand">


<div class="logo-icon">


<i data-lucide="wallet"></i>


</div>




<h1>

EarnCash

</h1>



<p>

Create your account and start earning today.

</p>




</div>
<!-- ==========================
            REGISTER CARD
=========================== -->


<div class="auth-card">





<h2>

Create Account

</h2>








<!-- ERROR -->


<div class="auth-error" id="registerError">


Please check your details.


</div>








<!-- SUCCESS -->


<div class="auth-success" id="registerSuccess">


Account created successfully.


</div>









<form id="registerForm">








<!-- FULL NAME -->


<div class="input-group">


<label>

Full Name

</label>




<input aria-label="Enter your full name"

type="text"

id="registerName"

placeholder="Enter your full name"

required>



</div>








<!-- EMAIL -->


<div class="input-group">


<label>

Email Address

</label>




<input aria-label="Enter your email"

type="email"

id="registerEmail"

placeholder="Enter your email"

required>




</div>









<!-- PHONE -->


<div class="input-group">


<label>

Phone Number

</label>




<input aria-label="+254 700 000000"

type="tel"

id="registerPhone"

placeholder="+254 700 000000"

required>




</div>









<!-- PASSWORD -->


<div class="input-group">


<label>

Password

</label>



<div class="password-box">


<input aria-label="Create password"

type="password"

id="registerPassword"

placeholder="Create password"

required>



<i data-lucide="eye"

id="toggleRegisterPassword"></i>



</div>


</div>









<!-- CONFIRM PASSWORD -->


<div class="input-group">


<label>

Confirm Password

</label>



<div class="password-box">


<input aria-label="Confirm password"

type="password"

id="confirmPassword"

placeholder="Confirm password"

required>



<i data-lucide="eye"

id="toggleConfirmPassword"></i>



</div>


</div>






<!-- REFERRAL CODE -->


<div class="input-group">


<label>

Referral Code (optional)

</label>


<input aria-label="e.g. EC4F92A1B7"
type="text"
id="registerReferralCode"
placeholder="e.g. EC4F92A1B7">


</div>


<!-- TERMS -->


<div class="remember">


<input

type="checkbox"

id="terms"

required>




<label for="terms">


I agree to the terms and conditions


</label>



</div>








<!-- CREATE ACCOUNT BUTTON -->


<button

type="submit"

class="btn auth-btn">



Create Account



</button>







</form>









<div class="auth-link">


Already have an account?



<a href="login.html">


Login Here


</a>



</div>







</div>





</div>


</section>








<!-- JAVASCRIPT -->


<script src="https://unpkg.com/lucide@latest"></script>

<script>lucide.createIcons();</script>

<script src="../js/config.js"></script>

<script src="../js/auth.js"></script>





</body>


</html>
