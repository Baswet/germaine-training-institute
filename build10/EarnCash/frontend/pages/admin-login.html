<!DOCTYPE html>

<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<meta name="description" content="EarnFastCash administrator sign in.">
<link rel="canonical" href="https://site.germaineinstitute.ac.ke/EarnCash/frontend/pages/admin-login.html">



<title>

EarnCash | Admin Login

</title>






<!-- CSS -->


<link rel="stylesheet" href="../css/variables.css">


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet" href="../css/background.css">


<link rel="stylesheet" href="../css/admin.css">





<!-- ICONS -->





</head>







<body>







<div class="background-blobs">


<span class="blob blob1"></span>


<span class="blob blob2"></span>


<span class="blob blob3"></span>



</div>








<div class="cursor-glow"></div>









<!-- ==========================
        ADMIN LOGIN
=========================== -->


<main class="admin-login">





<div class="glass admin-login-card">







<div class="admin-logo">


<i data-lucide="shield-check"></i>


</div>






<h1>

Admin Portal

</h1>






<p>

Secure platform management

</p>







<form id="adminLoginForm">






<div class="input-group">


<label>

Admin Email

</label>



<input aria-label="Enter admin email"

type="email"

id="adminUsername"

placeholder="Enter admin email"

required>



</div>








<div class="input-group">


<label>

Password

</label>




<input aria-label="Enter password"

type="password"

id="adminPassword"

placeholder="Enter password"

required>



</div>







<div

class="admin-error"

id="adminError">


</div>








<button

type="submit"

class="btn">


Login To Admin Panel


</button>







</form>







</div>






</main>








<script src="https://unpkg.com/lucide@latest"></script>

<script>lucide.createIcons();</script>

<script src="../js/config.js"></script>

<script src="../js/admin.js"></script>






</body>


</html>
