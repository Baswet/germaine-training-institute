<!DOCTYPE html>

<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<meta name="description" content="Sign in to your EarnFastCash account.">
<link rel="canonical" href="https://site.germaineinstitute.ac.ke/EarnCash/frontend/pages/login.html">



<title>

EarnCash | Login

</title>




<!-- GLOBAL CSS -->


<link rel="stylesheet" href="../css/variables.css">

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/background.css">

<link rel="stylesheet" href="../css/auth.css">




<!-- ICONS -->




</head>





<body>




<!-- BACKGROUND -->

<div class="background-blobs">


<span class="blob blob1"></span>

<span class="blob blob2"></span>

<span class="blob blob3"></span>


</div>





<div class="cursor-glow"></div>







<!-- ==========================
            LOGIN SECTION
=========================== -->


<section class="auth-section">





<div class="auth-container">






<!-- BRAND -->


<div class="auth-brand">



<div class="logo-icon">


<i data-lucide="wallet"></i>


</div>





<h1>

EarnCash

</h1>




<p>

Welcome back. Login to your earning dashboard.

</p>



</div>
<!-- ==========================
            LOGIN CARD
=========================== -->


<div class="auth-card">





<h2>

Login Account

</h2>






<!-- ERROR MESSAGE -->


<div class="auth-error" id="loginError">

Invalid email or password.

</div>








<form id="loginForm">








<!-- EMAIL -->


<div class="input-group">


<label>

Email Address

</label>



<input aria-label="Enter your email"

type="email"

id="loginEmail"

placeholder="Enter your email"

required>


</div>








<!-- PASSWORD -->


<div class="input-group">


<label>

Password

</label>



<div class="password-box">


<input aria-label="Enter your password"

type="password"

id="loginPassword"

placeholder="Enter your password"

required>




<i data-lucide="eye"

id="toggleLoginPassword"></i>



</div>



</div>









<!-- REMEMBER -->


<div class="remember">


<input

type="checkbox"

id="rememberMe">



<label for="rememberMe">

Remember me

</label>



</div>








<!-- LOGIN BUTTON -->


<button

type="submit"

class="btn auth-btn">


Login



</button>







</form>







<div class="auth-link">


Don't have an account?


<a href="register.html">


Create Account


</a>



</div>




</div>




</div>


</section>








<!-- JAVASCRIPT -->


<script src="https://unpkg.com/lucide@latest"></script>

<script>lucide.createIcons();</script>

<script src="../js/config.js"></script>

<script src="../js/auth.js"></script>


</body>


</html>
